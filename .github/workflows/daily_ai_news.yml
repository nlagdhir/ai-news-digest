name: Daily AI News Digest

on:
  schedule:
    # 30 2 * * * (UTC) = 8:00 AM IST (Asia/Kolkata, UTC+5:30), every day.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        type: choice
        default: "send"
        options:
          - send        # full run, sends the real daily email
          - test        # full run, writes preview.html as a build artifact, does NOT send
          - send-test   # full run, sends one real email (for manual verification)

permissions:
  contents: write # needed to commit back docs/data/today.json (the landing page's daily showcase)

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI news digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          TIMEZONE: ${{ secrets.TIMEZONE || 'Asia/Kolkata' }}
        run: |
          MODE="${{ github.event.inputs.mode || 'send' }}"
          case "$MODE" in
            test)
              python src/main.py --test
              ;;
            send-test)
              python src/main.py --send-test
              ;;
            *)
              python src/main.py
              ;;
          esac

      - name: Commit updated showcase data
        if: success()
        run: |
          if [ -n "$(git status --porcelain docs/data/today.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/data/today.json
            git commit -m "Update daily landing page showcase story"
            git push
          else
            echo "No showcase data change to commit"
          fi

      - name: Upload preview (test mode only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-html
          path: preview.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-logs
          path: logs/*.log
          if-no-files-found: ignore
          retention-days: 14
