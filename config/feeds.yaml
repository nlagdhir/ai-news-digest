# -----------------------------------------------------------------------------
# RSS feed configuration for the AI Daily News Digest.
#
# Add or remove a feed by editing the `feeds:` list below — no code changes
# needed. Each feed needs:
#   name:          human-readable label (used in logs and as fallback source name)
#   url:           the RSS/Atom feed URL
#   type:          official | wire | tech_pub | ai_pub | google_news
#   category_hint: one of the 8 digest categories (used as a hint only — the
#                  AI step may re-categorize a story based on its actual content)
#
# If a feed URL goes stale/dead over time, the app logs the failure and
# continues with the remaining feeds — it will not crash the whole run.
# -----------------------------------------------------------------------------

feeds:
  # ---- Official AI companies ----
  - name: "OpenAI News"
    url: "https://openai.com/news/rss.xml"
    type: official
    category_hint: "New AI Models"

  - name: "Google AI Blog"
    url: "https://blog.google/technology/ai/rss/"
    type: official
    category_hint: "New AI Models"

  - name: "Google DeepMind Blog"
    url: "https://deepmind.google/blog/rss.xml"
    type: official
    category_hint: "AI Research"

  - name: "Hugging Face Blog"
    url: "https://huggingface.co/blog/feed.xml"
    type: official
    category_hint: "AI Tools & Products"

  - name: "NVIDIA Blog"
    url: "https://blogs.nvidia.com/feed/"
    type: official
    category_hint: "AI Business & Funding"

  - name: "Microsoft Research"
    url: "https://www.microsoft.com/en-us/research/feed/"
    type: official
    category_hint: "AI Research"

  - name: "AWS Machine Learning Blog"
    url: "https://aws.amazon.com/blogs/machine-learning/feed/"
    type: official
    category_hint: "AI Tools & Products"

  - name: "Meta Engineering"
    url: "https://engineering.fb.com/feed/"
    type: official
    category_hint: "AI Research"

  - name: "Apple Machine Learning Research"
    url: "https://machinelearning.apple.com/rss.xml"
    type: official
    category_hint: "AI Research"

  # ---- AI news / technology publications ----
  - name: "TechCrunch AI"
    url: "https://techcrunch.com/category/artificial-intelligence/feed/"
    type: tech_pub
    category_hint: "Major AI News"

  - name: "MIT Technology Review"
    url: "https://www.technologyreview.com/feed/"
    type: ai_pub
    category_hint: "AI Research"

  - name: "VentureBeat AI"
    url: "https://venturebeat.com/category/ai/feed/"
    type: ai_pub
    category_hint: "AI Business & Funding"

  - name: "The Decoder"
    url: "https://the-decoder.com/feed/"
    type: ai_pub
    category_hint: "Major AI News"

  - name: "Import AI"
    url: "https://importai.substack.com/feed"
    type: ai_pub
    category_hint: "AI Research"

  - name: "Last Week in AI"
    url: "https://lastweekin.ai/feed"
    type: ai_pub
    category_hint: "Major AI News"

  - name: "IEEE Spectrum AI"
    url: "https://spectrum.ieee.org/feeds/topic/artificial-intelligence.rss"
    type: ai_pub
    category_hint: "AI Research"

  # ---- Google News topic feeds (discovery only, deduped against the above) ----
  - name: "Google News - AI"
    url: "https://news.google.com/rss/search?q=%22artificial+intelligence%22+when:1d&hl=en-IN&gl=IN&ceid=IN:en"
    type: google_news
    category_hint: "Major AI News"

  - name: "Google News - OpenAI"
    url: "https://news.google.com/rss/search?q=OpenAI+when:1d&hl=en-IN&gl=IN&ceid=IN:en"
    type: google_news
    category_hint: "New AI Models"

  - name: "Google News - ChatGPT"
    url: "https://news.google.com/rss/search?q=ChatGPT+when:1d&hl=en-IN&gl=IN&ceid=IN:en"
    type: google_news
    category_hint: "New AI Models"

  - name: "Google News - Gemini"
    url: "https://news.google.com/rss/search?q=%22Google+Gemini%22+when:1d&hl=en-IN&gl=IN&ceid=IN:en"
    type: google_news
    category_hint: "New AI Models"

  - name: "Google News - Claude AI"
    url: "https://news.google.com/rss/search?q=%22Claude+AI%22+OR+Anthropic+when:1d&hl=en-IN&gl=IN&ceid=IN:en"
    type: google_news
    category_hint: "New AI Models"

  - name: "Google News - AI Agents"
    url: "https://news.google.com/rss/search?q=%22AI+agents%22+when:1d&hl=en-IN&gl=IN&ceid=IN:en"
    type: google_news
    category_hint: "AI Coding & Agents"

  - name: "Google News - AI Coding"
    url: "https://news.google.com/rss/search?q=%22AI+coding%22+OR+%22AI+coding+assistant%22+when:1d&hl=en-IN&gl=IN&ceid=IN:en"
    type: google_news
    category_hint: "AI Coding & Agents"

  - name: "Google News - AI Regulation"
    url: "https://news.google.com/rss/search?q=%22AI+regulation%22+OR+%22AI+policy%22+when:1d&hl=en-IN&gl=IN&ceid=IN:en"
    type: google_news
    category_hint: "AI Regulation & Safety"

  - name: "Google News - AI India"
    url: "https://news.google.com/rss/search?q=%22Artificial+Intelligence%22+India+when:1d&hl=en-IN&gl=IN&ceid=IN:en"
    type: google_news
    category_hint: "India AI"

# -----------------------------------------------------------------------------
# Source priority table — used to pick the "best" representative article when
# multiple sources report the same story. Lower number = higher priority.
#   1 = official company sources
#   2 = wire services / major established publications
#   3 = major technology publications
#   4 = established AI publications
#   5 = everything else (default if a domain isn't listed here)
# -----------------------------------------------------------------------------
source_priority:
  # Tier 1 — official company sources
  openai.com: 1
  blog.google: 1
  deepmind.google: 1
  anthropic.com: 1
  huggingface.co: 1
  blogs.nvidia.com: 1
  microsoft.com: 1
  aws.amazon.com: 1
  engineering.fb.com: 1
  ai.meta.com: 1
  machinelearning.apple.com: 1

  # Tier 2 — wire services / major established publications
  reuters.com: 2
  apnews.com: 2
  bloomberg.com: 2

  # Tier 3 — major technology publications
  techcrunch.com: 3
  theverge.com: 3
  arstechnica.com: 3
  wired.com: 3

  # Tier 4 — established AI publications
  technologyreview.com: 4
  venturebeat.com: 4
  the-decoder.com: 4
  spectrum.ieee.org: 4
  importai.substack.com: 4
  lastweekin.ai: 4
